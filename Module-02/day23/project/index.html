<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Eats | Simple Ordering</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="nav">
      <div class="logo">
        <h1>🍴 Addis Eats</h1>
        <p>Authentic Ethiopian Cuisine</p>
      </div>

      <input
        type="text"
        id="search"
        class="search"
        placeholder="Search dishes (e.g. Doro, Shiro, Kitfo)..."
      />

      <div class="nav-buttons">
        <button class="cart-button">
          <span id="nav-cart-count">0 items</span> ·
          <span id="nav-cart-total">0 ETB</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <h2>Ethiopian Flavors Delivered to Your Door</h2>
      <p>
        Fresh 100% Teff Injera daily. Fast TeleBirr payment & live driver
        tracking.
      </p>
    </section>

    <main class="layout">
      <section class="content">
        <div class="filters">
          <div>
            <button class="chip" id="btn-spicy">Spicy Only</button>
          </div>
        </div>

        <div id="menu" class="grid"></div>
      </section>

      <aside class="sidebar">
        <h3>Your Order</h3>
        <p class="subtext" id="cart-item-count-label">0 items selected</p>

        <div id="cart-items" class="cart-list"></div>

        <div class="summary">
          <div class="row">
            <span>Subtotal</span>
            <span id="subtotal-val">0 ETB</span>
          </div>

          <div class="row">
            <span>Delivery</span>
            <span class="green-text">FREE</span>
          </div>

          <hr />

          <div class="row total">
            <strong>Total</strong>
            <strong id="grandtotal-val" class="green-text">0 ETB</strong>
          </div>

          <button id="checkout-btn" class="btn-primary">
            Checkout with TeleBirr
          </button>

          <!-- TeleBirr payment form -->
          <div id="payment-form" class="payment-form" style="display: none">
            <h3>TeleBirr Payment</h3>
            <p>Order Total: <strong id="payment-total">0 ETB</strong></p>
            <input
              type="text"
              id="customer-name"
              placeholder="Enter your name"
            />
            <input type="text" id="customer-phone" placeholder="09XXXXXXXX" />
            <p id="payment-error"></p>
            <button id="pay-btn" class="btn-primary">Pay with TeleBirr</button>
          </div>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <p>© 2026 Addis Eats</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
