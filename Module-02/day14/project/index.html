<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopian Airlines Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h2>Ethiopian Airlines</h2>
        <nav>
          <a href="#">Home</a>
          <a href="#">Flights</a>
          <a href="#">Profile</a>
        </nav>
      </header>
      <aside>
        <h3>Filters</h3>
        <p>Departure</p>
        <p>Destination</p>
        <p>Date</p>
      </aside>

      <main>
        <div class="toolbar">
          <h2>Flight Dashboard</h2>
          <button>Search</button>
        </div>
        <section class="cards">
          <div class="card">
            <span class="badge"> New </span>
            <h3>Addis Ababa → Dubai</h3>
            <p>Morning Flight</p>
            <button>Book</button>
          </div>
          <div class="card">
            <h3>Addis Ababa → Nairobi</h3>
            <p>Evening Flight</p>
            <button>Book</button>
          </div>
          <div class="card">
            <h3>Addis Ababa → London</h3>
            <p>Night Flight</p>
            <button>Book</button>
          </div>
        </section>
      </main>
      <footer>
        <p>Ethiopian Airlines © 2026</p>
      </footer>
    </div>
  </body>
</html>
