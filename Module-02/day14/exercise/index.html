<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet"href="style.css">
  </head>
  <body>
    <div class="page">
      <nav class="navbar">
        <h2 class="logo">Habesha Eatery</h2>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Menu</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <header class="hero">
        <h1>Habesha Eatery Ethiopian Food</h1>
        <p>Fresh, Traditional, Delicious.</p>
      </header>
      <main>
        <section class="menu-grid">
          <div class="card">
            <span class="badge">Popular</span>
            <h3>Doro Wat</h3>
            <p>Traditional spicy chicken stew.</p>
            <p class="price">450 ETB</p>
          </div>
          <div class="card">
            <h3>Kitfo</h3>
            <p>Fresh minced beef.</p>
            <p class="price">500 ETB</p>
          </div>
          <div class="card">
            <h3>Tibs</h3>
            <p>Fried beef with vegetables.</p>
            <p class="price">400 ETB</p>
          </div>
        </section>
      </main>
      <footer>
        <p>Bole, Addis Ababa</p>
      </footer>
    </div>
  </body>
</html>
