<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
    <script src="App.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="card">
            <h1>Birr Watch</h1>
            <p>Convert Ethiopian Birr to other currencies</p>
            <p id="status">Loading rates...</p>
            <form id="convert-form">
                <label for="amount">Amount in ETB</label>
                <input type="number" id="amount" >
                <label for="currency">Convert to</label>
                <select id="currency">
                    <option value="USD">USD </option>
                    <option value="EUR">EUR </option>
                    <option value="GBP">GBP </option>
                    <option value="KES">KES </option>
                    <option value="CAD">CAD </option>
                    <option value="AUD">AUD </option>
                    <option value="JPY">JPY </option>
                    <option value="CNY">CNY </option>
                    <option value="INR">INR </option>
                    <option value="AED">AED </option>
                    <option value="AMD">AMD</option>
                    <option value="ANG">ANG</option>
                    <option value="AZN">AZN</option>
                    <option value="BMD">BMD</option>
                    <option value="ETB">ETB</option>
                    <option value="DOP">DOP</option>
                    <option value="FKP">FKP</option>
                </select>
                 <div class="buttons">
                    <button type="submit">Convert</button>
                    <button type="button" id="watch">Watchlist</button>
                </div>
            </form>
             <div id="result"></div>
             <h2>Watchlist</h2>
             <ul id="watchlist"></ul>
        </div>
    </div>
</body>
</html>
